name = "ipinfo-proxy"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Keeps the existing URL working: https://ipinfo-proxy.gclark523.workers.dev
workers_dev = true

# Once api.soluniplabs.com is set up, uncomment and set workers_dev = false
# routes = [{ pattern = "api.soluniplabs.com", custom_domain = true }]

# 60 lookups per minute per visitor
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Secret (not stored here): wrangler secret put IPINFO_TOKEN
